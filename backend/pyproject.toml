[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
backend = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"